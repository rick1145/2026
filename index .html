<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星宿罗盘 · 二十八宿</title>
<style>
:root {
  --bg: #080e18;
  --surface: #0f172a;
  --ring: rgba(56, 189, 248, 0.22);
  --tick: rgba(148, 163, 184, 0.35);
  --text: #e2e8f0;
  --muted: #94a3b8;
  --gold: #38bdf8;
  --accent: #0ea5e9;
  --pointer: #f59e0b;
  --card: rgba(15, 25, 42, 0.75);
  --card-border: rgba(56, 189, 248, 0.15);

  --c-east: #2dd4bf;
  --c-north: #38bdf8;
  --c-west: #cbd5e1;
  --c-south: #fbbf24;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 12px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  background-image:
    radial-gradient(ellipse at 50% 30%, rgba(56,189,248,0.06) 0%, transparent 70%),
    radial-gradient(ellipse at 30% 70%, rgba(45,212,191,0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 70%, rgba(251,191,36,0.03) 0%, transparent 60%);
}

.app-container {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* ── 搜索栏 ── */
.search-bar {
  width: 100%;
  display: flex;
  gap: 8px;
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 34px;
  padding: 7px 8px 7px 16px;
}
.search-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 0.92rem;
  font-family: inherit;
}
.search-input::placeholder { color: var(--muted); }
.search-btn {
  background: linear-gradient(135deg, var(--accent), #0284c7);
  border: none;
  color: #fff;
  border-radius: 28px;
  padding: 9px 20px;
  font-weight: 600;
  font-size: 0.88rem;
  font-family: inherit;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 10px rgba(14,165,233,0.3);
}
.search-btn:active { transform: scale(0.95); }

/* ── 角度显示 ── */
.angle-box {
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 36px;
  padding: 6px 22px;
  display: flex;
  align-items: baseline;
  gap: 3px;
  box-shadow: 0 2px 16px rgba(56,189,248,0.08);
}
.angle-num {
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.angle-deg { color: var(--muted); font-size: 1.1rem; }

/* ── 罗盘容器 ── */
.compass-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 1/1;
  max-width: 370px;
}
.compass-svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 4px 24px rgba(0,0,0,0.6));
}

/* ── 固定指针（顶部） ── */
.fixed-pointer {
  position: absolute;
  top: -2px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  width: 0; height: 0;
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-top: 30px solid var(--pointer);
  filter: drop-shadow(0 0 10px rgba(245,158,11,0.9));
  pointer-events: none;
}
.fixed-pointer::after {
  content: '';
  position: absolute;
  top: -34px;
  left: -4px;
  width: 8px; height: 8px;
  background: var(--pointer);
  border-radius: 50%;
  filter: blur(3px);
  opacity: 0.6;
}

/* ── 当前星宿徽章 ── */
.current-star-badge {
  position: absolute;
  top: 34px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 22px;
  padding: 5px 18px;
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--gold);
  white-space: nowrap;
  z-index: 10;
  box-shadow: 0 2px 14px rgba(0,0,0,0.4);
  pointer-events: none;
  transition: color 0.4s;
}

/* ── 底部按钮 ── */
.btn-row {
  display: flex;
  gap: 10px;
  width: 100%;
}
.btn {
  flex: 1;
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  color: var(--text);
  padding: 10px 0;
  border-radius: 30px;
  cursor: pointer;
  font-size: 0.88rem;
  font-family: inherit;
  font-weight: 500;
  transition: all 0.2s;
  text-align: center;
}
.btn:active { transform: scale(0.96); }
.btn.accent {
  background: linear-gradient(135deg, var(--accent), #0284c7);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 2px 12px rgba(14,165,233,0.25);
}

/* ── 信息卡片 ── */
.info-card {
  width: 100%;
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 18px 16px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.35);
}
.star-name-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.star-name {
  font-size: 1.7rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.03em;
}
.lock-icon {
  cursor: pointer;
  font-size: 1.2rem;
  opacity: 0.6;
  transition: opacity 0.2s;
}
.lock-icon:hover { opacity: 1; }
.star-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.tag {
  font-size: 0.78rem;
  padding: 3px 10px;
  border-radius: 14px;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.tag-element { background: rgba(56,189,248,0.12); color: var(--gold); }
.tag-quadrant { background: rgba(255,255,255,0.06); color: var(--muted); }
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  font-size: 0.78rem;
}
.info-item {
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.info-label { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
.info-value { color: var(--text); font-weight: 500; }

/* ── 校准覆盖层 ── */
.calib-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(5,12,20,0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  transition: opacity 0.35s;
}
.calib-overlay.hidden { display: none; }
.calib-title {
  font-size: 1.2rem;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 24px;
}
.calib-ring {
  width: 140px; height: 140px;
  border: 3px dashed var(--gold);
  border-radius: 50%;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: calibSpin 2.5s linear infinite;
}
.calib-ring-inner {
  width: 100px; height: 100px;
  border: 2px dashed rgba(56,189,248,0.35);
  border-radius: 50%;
  animation: calibSpin 4s linear infinite reverse;
}
@keyframes calibSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.calib-progress {
  width: 200px; height: 5px;
  background: rgba(255,255,255,0.12);
  border-radius: 3px;
  margin-bottom: 10px;
  overflow: hidden;
}
.calib-progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  border-radius: 3px;
  transition: width 0.25s;
}
.calib-status {
  color: var(--muted);
  font-size: 0.85rem;
  margin-bottom: 24px;
}
.close-calib {
  padding: 12px 40px;
  background: linear-gradient(135deg, var(--accent), #0284c7);
  border: none;
  border-radius: 30px;
  color: #fff;
  font-weight: 600;
  font-size: 0.95rem;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(14,165,233,0.3);
  transition: transform 0.15s;
}
.close-calib:active { transform: scale(0.95); }

@keyframes flashGold {
  0%, 100% { fill: inherit; }
  50% { fill: #fbbf24; }
}
.sector-flash { animation: flashGold 0.28s ease-in-out 3; }
</style>
</head>
<body>

<div class="app-container">

  <!-- 搜索 -->
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索星宿（如：角、心、斗）">
    <button class="search-btn" id="searchBtn">🔍 定位</button>
  </div>

  <!-- 角度 -->
  <div class="angle-box">
    <span class="angle-num" id="angleValue">0</span>
    <span class="angle-deg">°</span>
  </div>

  <!-- 罗盘 -->
  <div class="compass-wrapper">
    <div class="fixed-pointer"></div>
    <div class="current-star-badge" id="currentStarBadge">角木蛟</div>
    <svg class="compass-svg" viewBox="0 0 300 300">
      <defs>
        <radialGradient id="faceGrad" cx="50%" cy="50%">
          <stop offset="0%" stop-color="#1a2538"/>
          <stop offset="100%" stop-color="#0a1220"/>
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx="150" cy="150" r="146" fill="url(#faceGrad)" stroke="var(--ring)" stroke-width="2"/>
      <!-- 内圈装饰 -->
      <circle cx="150" cy="150" r="90" fill="none" stroke="var(--ring)" stroke-width="0.5" opacity="0.5"/>
      <circle cx="150" cy="150" r="55" fill="none" stroke="var(--ring)" stroke-width="0.3" opacity="0.3"/>
      <!-- 中心点 -->
      <circle cx="150" cy="150" r="3" fill="var(--gold)" filter="url(#glow)" opacity="0.8"/>
      <g id="rotateGroup" style="transform-origin: 150px 150px;">
        <g id="sectorsGroup"></g>
        <g id="labelsGroup"></g>
        <g id="tickLabelsGroup"></g>
        <g id="ticksGroup"></g>
        <g id="quadrantGroup"></g>
      </g>
    </svg>
  </div>

  <!-- 按钮 -->
  <div class="btn-row">
    <button class="btn accent" id="calibrateBtn">🧭 校准</button>
    <button class="btn" id="resetCalibBtn">↺ 重置</button>
  </div>

  <!-- 信息卡片 -->
  <div class="info-card">
    <div class="star-name-row">
      <span class="star-name" id="starName">角木蛟</span>
      <span class="lock-icon" id="lockIcon" title="锁定/解锁星宿">🔓</span>
    </div>
    <div class="star-tags">
      <span class="tag tag-element" id="starElement">🌲 木</span>
      <span class="tag tag-quadrant" id="starQuadrant">🐉 东方青龙</span>
    </div>
    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">角度范围</span>
        <span class="info-value" id="starRange">84.1° ~ 95.9°</span>
      </div>
      <div class="info-item">
        <span class="info-label">地理方向</span>
        <span class="info-value" id="starDirection">东</span>
      </div>
      <div class="info-item">
        <span class="info-label">当前指向角</span>
        <span class="info-value" id="starPointed">—</span>
      </div>
      <div class="info-item">
        <span class="info-label">传感器状态</span>
        <span class="info-value" id="sensorStatus">等待中</span>
      </div>
    </div>
  </div>

</div>

<!-- 校准覆盖层 -->
<div class="calib-overlay hidden" id="calibOverlay">
  <div class="calib-title">🧭 校准指南针</div>
  <div class="calib-ring"><div class="calib-ring-inner"></div></div>
  <div class="calib-progress"><div class="calib-progress-bar" id="calibProgressBar"></div></div>
  <div class="calib-status" id="calibStatus">请缓慢旋转手机画大圆 · 0%</div>
  <button class="close-calib" id="closeCalibBtn">✓ 完成校准</button>
</div>

<script>
(function() {
  // ══════════════════════════════════════
  // 二十八星宿数据
  // 角度按传统中国罗盘（0° = 南 = 朱雀），顺时针递增
  // ══════════════════════════════════════
  const stars = [
    { name:"角木蛟", el:"木", q:"东", start:84.1,  end:95.9,  dir:"东" },
    { name:"亢金龙", el:"金", q:"东", start:95.9,  end:104.9, dir:"东" },
    { name:"氐土貉", el:"土", q:"东", start:104.9, end:119.8, dir:"东" },
    { name:"房日兔", el:"日", q:"东", start:119.8, end:124.7, dir:"东" },
    { name:"心月狐", el:"月", q:"东", start:124.7, end:129.7, dir:"东" },
    { name:"尾火虎", el:"火", q:"东", start:129.7, end:147.4, dir:"东" },
    { name:"箕水豹", el:"水", q:"东", start:147.4, end:158.5, dir:"东" },
    { name:"斗木獬", el:"木", q:"北", start:158.5, end:184.0, dir:"北" },
    { name:"牛金牛", el:"金", q:"北", start:184.0, end:191.9, dir:"北" },
    { name:"女土蝠", el:"土", q:"北", start:191.9, end:203.8, dir:"北" },
    { name:"虚日鼠", el:"日", q:"北", start:203.8, end:213.7, dir:"北" },
    { name:"危月燕", el:"月", q:"北", start:213.7, end:230.5, dir:"北" },
    { name:"室火猪", el:"火", q:"北", start:230.5, end:246.4, dir:"北" },
    { name:"壁水貐", el:"水", q:"北", start:246.4, end:255.2, dir:"北" },
    { name:"奎木狼", el:"木", q:"西", start:255.2, end:271.1, dir:"西" },
    { name:"娄金狗", el:"金", q:"西", start:271.1, end:282.9, dir:"西" },
    { name:"胃土雉", el:"土", q:"西", start:282.9, end:296.7, dir:"西" },
    { name:"昴日鸡", el:"日", q:"西", start:296.7, end:307.6, dir:"西" },
    { name:"毕月乌", el:"月", q:"西", start:307.6, end:323.5, dir:"西" },
    { name:"觜火猴", el:"火", q:"西", start:323.5, end:325.4, dir:"西" },
    { name:"参水猿", el:"水", q:"西", start:325.4, end:334.4, dir:"西" },
    { name:"井木犴", el:"木", q:"南", start:334.4, end:7.3,   dir:"南", cross:true },
    { name:"鬼金羊", el:"金", q:"南", start:7.3,   end:11.2,  dir:"南" },
    { name:"柳土獐", el:"土", q:"南", start:11.2,  end:26.1,  dir:"南" },
    { name:"星日马", el:"日", q:"南", start:26.1,  end:33.0,  dir:"南" },
    { name:"张月鹿", el:"月", q:"南", start:33.0,  end:50.8,  dir:"南" },
    { name:"翼火蛇", el:"火", q:"南", start:50.8,  end:68.6,  dir:"南" },
    { name:"轸水蚓", el:"水", q:"南", start:68.6,  end:84.1,  dir:"南" }
  ];

  // ═══════════ DOM 引用 ═══════════
  const rotateGroup  = document.getElementById('rotateGroup');
  const sectorsGroup = document.getElementById('sectorsGroup');
  const angleEl      = document.getElementById('angleValue');
  const badgeEl      = document.getElementById('currentStarBadge');
  const calibOverlay = document.getElementById('calibOverlay');
  const calibBar     = document.getElementById('calibProgressBar');
  const calibStatus  = document.getElementById('calibStatus');
  const sensorStEl   = document.getElementById('sensorStatus');

  // ═══════════ 状态 ═══════════
  let currentAngle    = 0;
  let targetAngle     = 0;
  let animFrame       = null;
  let compassActive   = false;
  let lockedIndex     = -1;

  let rawHeading      = 0;
  let filteredHeading = 0;
  const SMOOTH        = 0.10;

  let calibrationOffset = 0;
  try {
    const s = localStorage.getItem('compass_calib_offset');
    if (s) calibrationOffset = parseFloat(s);
  } catch(e) {}

  let isCalibrating        = false;
  let calibrationSamples   = [];
  let calibrationStartTime = 0;
  const CALIB_DURATION     = 6000;

  // ═══════════ 四象颜色 ═══════════
  function qColor(q) {
    return `var(--c-${q==='东'?'east':q==='北'?'north':q==='西'?'west':'south'})`;
  }
  function elIcon(el) {
    const map = {木:'🌲',金:'⚜️',土:'⛰️',日:'☀️',月:'🌙',火:'🔥',水:'💧'};
    return (map[el]||'')+' '+el;
  }
  function qFull(q) {
    const map = {东:'🐉 东方青龙',北:'🐢 北方玄武',西:'🐅 西方白虎',南:'🦅 南方朱雀'};
    return map[q]||q;
  }

  // ═══════════ 绘制扇区 ═══════════
  const CX = 150, CY = 150, OR = 145, IR = 92, TR = 120;

  function arcPath(sA, eA) {
    const r1  = (sA - 90) * Math.PI / 180;
    const r2  = (eA - 90) * Math.PI / 180;
    const la  = (eA - sA) > 180 ? 1 : 0;
    const x1o = CX + OR * Math.cos(r1), y1o = CY + OR * Math.sin(r1);
    const x2o = CX + OR * Math.cos(r2), y2o = CY + OR * Math.sin(r2);
    const x1i = CX + IR * Math.cos(r1), y1i = CY + IR * Math.sin(r1);
    const x2i = CX + IR * Math.cos(r2), y2i = CY + IR * Math.sin(r2);
    return `M${x1o},${y1o} A${OR},${OR} 0 ${la} 1 ${x2o},${y2o} L${x2i},${y2i} A${IR},${IR} 0 ${la} 0 ${x1i},${y1i} Z`;
  }

  function draw() {
    // 清空
    ['sectorsGroup','labelsGroup','tickLabelsGroup','ticksGroup','quadrantGroup'].forEach(id => {
      document.getElementById(id).innerHTML = '';
    });

    // 扇区
    stars.forEach((s, i) => {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', s.cross
        ? arcPath(s.start, 360) + ' ' + arcPath(0, s.end)
        : arcPath(s.start, s.end));
      p.setAttribute('fill', qColor(s.q));
      p.setAttribute('fill-opacity', '0.35');
      p.setAttribute('stroke', 'rgba(255,255,255,0.08)');
      p.setAttribute('stroke-width', '0.8');
      p.setAttribute('data-index', i);
      p.style.cursor = 'pointer';
      p.style.transition = 'fill-opacity 0.3s, stroke 0.3s';
      p.addEventListener('click', () => toggleLock(i));
      sectorsGroup.appendChild(p);
    });

    // 星宿首字标签
    stars.forEach((s, i) => {
      const span = s.cross ? (360 - s.start + s.end) : (s.end - s.start);
      if (span >= 7) {
        const mid = s.cross ? ((s.start + s.end + 360) / 2) % 360 : (s.start + s.end) / 2;
        const rad = (mid - 90) * Math.PI / 180;
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', CX + TR * Math.cos(rad));
        t.setAttribute('y', CY + TR * Math.sin(rad));
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.setAttribute('fill', '#fff');
        t.setAttribute('font-size', '15');
        t.setAttribute('font-weight', '500');
        t.setAttribute('pointer-events', 'none');
        t.textContent = s.name.charAt(0);
        document.getElementById('labelsGroup').appendChild(t);
      }
    });

    // 刻度数字 (每30°)
    for (let d = 0; d < 360; d += 30) {
      const rad = (d - 90) * Math.PI / 180;
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', CX + (OR + 15) * Math.cos(rad));
      t.setAttribute('y', CY + (OR + 15) * Math.sin(rad));
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dominant-baseline', 'central');
      t.setAttribute('fill', 'var(--muted)');
      t.setAttribute('font-size', '9');
      t.setAttribute('pointer-events', 'none');
      t.textContent = d === 0 ? '0/360' : d;
      document.getElementById('tickLabelsGroup').appendChild(t);
    }

    // 刻度线 (每5°)
    for (let d = 0; d < 360; d += 5) {
      const rad = (d - 90) * Math.PI / 180;
      const x1 = CX + (OR - 2) * Math.cos(rad), y1 = CY + (OR - 2) * Math.sin(rad);
      const ie = d % 15 === 0 ? OR - 14 : OR - 8;
      const x2 = CX + ie * Math.cos(rad), y2 = CY + ie * Math.sin(rad);
      const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1);
      l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('stroke', 'var(--tick)');
      l.setAttribute('stroke-width', d % 15 === 0 ? '1.5' : '0.5');
      l.setAttribute('pointer-events', 'none');
      document.getElementById('ticksGroup').appendChild(l);
    }

    // 四象文字：上朱雀·下玄武·左青龙·右白虎（传统布局）
    const quads = [
      { n:'朱 雀', a:0,   q:'南' },
      { n:'玄 武', a:180, q:'北' },
      { n:'青 龙', a:270, q:'东' },
      { n:'白 虎', a:90,  q:'西' }
    ];
    quads.forEach(q => {
      const rad = (q.a - 90) * Math.PI / 180;
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', CX + 62 * Math.cos(rad));
      t.setAttribute('y', CY + 62 * Math.sin(rad));
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dominant-baseline', 'central');
      t.setAttribute('fill', qColor(q.q));
      t.setAttribute('font-size', '17');
      t.setAttribute('font-weight', 'bold');
      t.setAttribute('letter-spacing', '0.15em');
      t.setAttribute('pointer-events', 'none');
      t.textContent = q.n;
      document.getElementById('quadrantGroup').appendChild(t);
    });
  }

  // ═══════════ 根据传统角度找星宿 ═══════════
  function starAt(traditionalAngle) {
    let a = ((traditionalAngle % 360) + 360) % 360;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      if (s.cross) { if (a >= s.start || a <= s.end) return i; }
      else if (a >= s.start && a < s.end) return i;
    }
    return 0;
  }

  // ═══════════ 更新UI ═══════════
  function updateUI() {
    // ★ 核心修复：传统角度 = 现代航向 + 180°（南在上 → 北在上）
    const pointed = ((filteredHeading + calibrationOffset + 180) % 360 + 360) % 360;
    angleEl.textContent = Math.round(pointed);

    const idx = lockedIndex !== -1 ? lockedIndex : starAt(pointed);
    badgeEl.textContent = stars[idx].name;

    // 高亮当前扇区
    document.querySelectorAll('#sectorsGroup path').forEach(p => {
      const i = parseInt(p.dataset.index);
      if (i === idx) {
        p.setAttribute('fill-opacity', '0.65');
        p.setAttribute('stroke', '#ffffff');
        p.setAttribute('stroke-width', '2.2');
        p.style.filter = 'drop-shadow(0 0 12px rgba(245,158,11,0.6))';
      } else if (i === lockedIndex) {
        p.setAttribute('fill-opacity', '0.55');
        p.setAttribute('stroke', 'var(--pointer)');
        p.setAttribute('stroke-width', '1.8');
        p.style.filter = 'none';
      } else {
        p.setAttribute('fill-opacity', '0.35');
        p.setAttribute('stroke', 'rgba(255,255,255,0.08)');
        p.setAttribute('stroke-width', '0.8');
        p.style.filter = 'none';
      }
    });

    updateCard(idx);
    document.getElementById('starPointed').textContent = Math.round(pointed) + '°';
  }

  function updateCard(i) {
    const s = stars[i];
    document.getElementById('starName').textContent = s.name;
    document.getElementById('starElement').textContent = elIcon(s.el);
    document.getElementById('starQuadrant').textContent = qFull(s.q);
    document.getElementById('starRange').textContent =
      s.cross ? `${s.start.toFixed(1)}°→360° / 0°→${s.end.toFixed(1)}°`
              : `${s.start.toFixed(1)}° ~ ${s.end.toFixed(1)}°`;
    document.getElementById('starDirection').textContent = s.dir;
  }

  // ═══════════ 锁定 / 解锁 ═══════════
  function toggleLock(i) {
    if (lockedIndex === i) {
      lockedIndex = -1;
      document.getElementById('lockIcon').textContent = '🔓';
    } else {
      lockedIndex = i;
      updateCard(i);
      document.getElementById('lockIcon').textContent = '🔒';
    }
    updateUI();
  }

  document.getElementById('lockIcon').addEventListener('click', (e) => {
    e.stopPropagation();
    if (lockedIndex !== -1) {
      lockedIndex = -1;
      document.getElementById('lockIcon').textContent = '🔓';
      updateUI();
    }
  });

  // ═══════════ 最短路径旋转动画 ═══════════
  function animate() {
    const diff = targetAngle - currentAngle;
    if (Math.abs(diff) < 0.05) {
      currentAngle = targetAngle;
      rotateGroup.style.transform = `rotate(${currentAngle}deg)`;
      updateUI();
      animFrame = null;
      return;
    }
    currentAngle += diff * 0.22;
    rotateGroup.style.transform = `rotate(${currentAngle}deg)`;
    updateUI();
    animFrame = requestAnimationFrame(animate);
  }

  // ★ 核心修复：rawTarget = -(heading + offset + 180)，补齐南在上→北在上的 180° 差异
  function setTarget() {
    const rawTarget = -(filteredHeading + calibrationOffset + 180);
    let curNorm = ((currentAngle % 360) + 360) % 360;
    let tNorm   = ((rawTarget % 360) + 360) % 360;
    let diff = tNorm - curNorm;
    if (diff > 180) diff -= 360;
    else if (diff < -180) diff += 360;
    targetAngle = currentAngle + diff;
    if (!animFrame) animFrame = requestAnimationFrame(animate);
  }

  // ═══════════ 传感器处理（指数平滑滤波） ═══════════
  function processHeading(raw) {
    if (raw === null || isNaN(raw)) return;
    rawHeading = raw;
    filteredHeading = filteredHeading + SMOOTH * (rawHeading - filteredHeading);

    if (isCalibrating) {
      calibrationSamples.push(raw);
      const elapsed = Date.now() - calibrationStartTime;
      const progress = Math.min(elapsed / CALIB_DURATION, 1);
      calibBar.style.width = (progress * 100) + '%';
      calibStatus.textContent = `请缓慢旋转手机画大圆 · ${Math.round(progress * 100)}%`;
      if (elapsed >= CALIB_DURATION) finishCalibration();
    } else {
      setTarget();
    }
  }

  function handleOrientation(e) {
    if (!compassActive) return;
    let h = e.webkitCompassHeading;
    if (h === undefined && e.alpha !== null) h = (360 - e.alpha) % 360;
    if (h !== undefined) {
      sensorStEl.textContent = '✓ 工作中';
      sensorStEl.style.color = '#4ade80';
      processHeading(h);
    }
  }

  function startCompass() {
    if (window.DeviceOrientationEvent) {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        compassActive = false;
        sensorStEl.textContent = '需授权';
        sensorStEl.style.color = 'var(--muted)';
        document.body.addEventListener('click', async function ask() {
          try {
            const perm = await DeviceOrientationEvent.requestPermission();
            if (perm === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              compassActive = true;
              sensorStEl.textContent = '✓ 工作中';
              sensorStEl.style.color = '#4ade80';
            }
          } catch(e) { sensorStEl.textContent = '授权失败'; }
          document.body.removeEventListener('click', ask);
        }, { once: true });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        compassActive = true;
        sensorStEl.textContent = '✓ 工作中';
        sensorStEl.style.color = '#4ade80';
      }
    } else {
      sensorStEl.textContent = '不支持';
      sensorStEl.style.color = '#f87171';
    }
  }

  // ═══════════ 校准 ═══════════
  function startCalibration() {
    if (isCalibrating) return;
    isCalibrating = true;
    calibrationSamples = [];
    calibrationStartTime = Date.now();
    calibOverlay.classList.remove('hidden');
    calibBar.style.width = '0%';
    calibStatus.textContent = '请缓慢旋转手机画大圆 · 0%';
  }

  function finishCalibration() {
    if (!isCalibrating) return;
    isCalibrating = false;
    calibOverlay.classList.add('hidden');

    if (calibrationSamples.length > 20) {
      const avg = calibrationSamples.reduce((a,b) => a + b, 0) / calibrationSamples.length;
      calibrationOffset = Math.round((360 - avg) * 10) / 10;
      try { localStorage.setItem('compass_calib_offset', String(calibrationOffset)); } catch(e) {}
      alert(`✅ 校准完成！偏移量：${calibrationOffset.toFixed(1)}°\n请将手机指向正北方验证。`);
    } else {
      alert('⚠️ 校准样本不足，请重试并确保缓慢旋转手机。');
    }
    setTarget();
  }

  function resetCalibration() {
    calibrationOffset = 0;
    try { localStorage.removeItem('compass_calib_offset'); } catch(e) {}
    alert('偏移量已重置为 0°');
    setTarget();
  }

  document.getElementById('calibrateBtn').addEventListener('click', startCalibration);
  document.getElementById('resetCalibBtn').addEventListener('click', resetCalibration);
  document.getElementById('closeCalibBtn').addEventListener('click', () => {
    if (isCalibrating) finishCalibration();
    else calibOverlay.classList.add('hidden');
  });

  // ═══════════ 搜索定位 ═══════════
  document.getElementById('searchBtn').addEventListener('click', () => {
    const kw = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!kw) return;
    const idx = stars.findIndex(s => s.name.includes(kw) || s.name.charAt(0) === kw);
    if (idx === -1) { alert('未找到匹配的星宿'); return; }

    const star = stars[idx];
    const mid = star.cross
      ? ((star.start + star.end + 360) / 2) % 360
      : (star.start + star.end) / 2;

    lockedIndex = idx;
    updateCard(idx);
    document.getElementById('lockIcon').textContent = '🔒';

    // ★ 修复：搜索定位也补齐 180° 偏移
    const originalFiltered = filteredHeading;
    filteredHeading = ((mid - 180 - calibrationOffset) % 360 + 360) % 360;
    setTarget();

    // 闪烁
    document.querySelectorAll(`#sectorsGroup path[data-index="${idx}"]`).forEach(p => {
      p.classList.add('sector-flash');
      setTimeout(() => p.classList.remove('sector-flash'), 1200);
    });

    // 0.6 秒后恢复传感器
    setTimeout(() => {
      filteredHeading = originalFiltered;
      setTarget();
    }, 600);
  });

  // 回车搜索
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('searchBtn').click();
  });

  // ═══════════ 启动 ═══════════
  draw();
  startCompass();
  setTarget();
})();
</script>
</body>
</html>
