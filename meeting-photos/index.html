<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>26年浙大培训会议照片</title>

  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#0E2E91',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .card-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .card-hover:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      .img-zoom {
        transition: transform 0.5s ease;
      }
      .img-zoom:hover {
        transform: scale(1.08);
      }
      .btn-glow {
        transition: all 0.3s ease;
      }
      .btn-glow:hover {
        box-shadow: 0 0 15px rgba(22, 93, 255, 0.5);
      }
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
  <!-- 顶部导航栏 -->
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fa fa-university text-primary text-2xl"></i>
        <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
          26年浙大培训会议照片
        </h1>
      </div>
      <div class="flex gap-3">
        <button id="scrollTop" class="hidden p-2 rounded-full bg-primary text-white hover:bg-primary/90 transition-all">
          <i class="fa fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 英雄区 -->
  <section class="relative bg-gradient-to-br from-primary/10 to-secondary/5 py-16 sm:py-24">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold mb-4 text-slate-900">
        记录每一个珍贵瞬间
      </h2>
      <p class="text-lg sm:text-xl text-slate-600 max-w-3xl mx-auto mb-8">
        2026年浙江大学科技园培训会议 · 精彩回顾
      </p>
      <div class="flex flex-wrap justify-center gap-4">
        <button id="viewAll" class="px-6 py-3 bg-primary text-white rounded-full font-medium btn-glow">
          <i class="fa fa-images mr-2"></i>浏览全部照片
        </button>
        <button id="downloadAll" class="px-6 py-3 bg-white text-primary border border-primary rounded-full font-medium hover:bg-primary/5 transition-all">
          <i class="fa fa-download mr-2"></i>批量下载说明
        </button>
      </div>
    </div>
  </section>

  <!-- 照片画廊 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <!-- 页脚 -->
  <footer class="bg-slate-900 text-white py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <p class="text-slate-400">© 2026 天文汉字培训会议 · 所有照片仅供内部交流使用</p>
    </div>
  </footer>

  <!-- 全屏预览模态框 -->
  <div id="modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
    <button id="closeModal" class="absolute top-6 right-6 text-white text-3xl hover:text-gray-300">
      <i class="fa fa-times"></i>
    </button>
    <img id="modalImg" class="max-w-full max-h-[90vh] object-contain" src="" alt="" />
  </div>

    ];

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const closeModal = document.getElementById('closeModal');
    const scrollTopBtn = document.getElementById('scrollTop');
    const viewAllBtn = document.getElementById('viewAll');
    const downloadAllBtn = document.getElementById('downloadAll');

    // 渲染照片卡片
    function renderGallery() {
      gallery.innerHTML = '';
      images.forEach((src, index) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl overflow-hidden shadow-md card-hover';
        
        card.innerHTML = `
          <div class="relative aspect-[4/3] overflow-hidden">
            <img 
              src="images/${src}" 
              alt="会议照片 ${index + 1}" 
              class="w-full h-full object-cover img-zoom cursor-zoom-in"
              loading="lazy"
            />
            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-3 flex justify-between items-center opacity-0 hover:opacity-100 transition-opacity">
              <span class="text-white text-sm">第 ${index + 1} 张</span>
              <a 
                href="images/${src}" 
                download="${src}" 
                class="text-white bg-primary/80 hover:bg-primary p-2 rounded-full transition-colors"
                title="下载这张照片"
              >
                <i class="fa fa-download"></i>
              </a>
            </div>
          </div>
        `;
        
        // 点击图片全屏预览
        const img = card.querySelector('img');
        img.addEventListener('click', () => {
          modal.classList.remove('hidden');
          modalImg.src = `images/${src}`;
          modalImg.alt = `会议照片 ${index + 1}`;
          document.body.style.overflow = 'hidden';
        });
        
        gallery.appendChild(card);
      });
    }

    // 关闭模态框
    closeModal.addEventListener('click', () => {
      modal.classList.add('hidden');
      document.body.style.overflow = 'auto';
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.add('hidden');
        document.body.style.overflow = 'auto';
      }
    });

    // ESC 关闭模态框
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
        modal.classList.add('hidden');
        document.body.style.overflow = 'auto';
      }
    });

    // 回到顶部按钮
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        scrollTopBtn.classList.remove('hidden');
      } else {
        scrollTopBtn.classList.add('hidden');
      }
    });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 按钮交互
    viewAllBtn.addEventListener('click', () => {
      gallery.scrollIntoView({ behavior: 'smooth' });
    });

    downloadAllBtn.addEventListener('click', () => {
      alert('批量下载功能：请右键点击单张照片，选择“图片另存为”保存到本地。\n如需批量打包，请联系管理员获取压缩包。');
    });

    // 初始化渲染
    renderGallery();
  </script>
</body>
</html>
