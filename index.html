<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>星宿罗盘 · 二十八宿</title>
<style>
:root,[data-theme="dark"]{
  --bg:#030a16;--surface:#071221;--ring:rgba(56,189,248,.14);
  --tick:rgba(148,163,184,.20);--text:#e4eaf2;--muted:#7e8ea8;
  --gold:#5eead4;--accent:#2dd4bf;--ptr:#ef4444;--ptr2:rgba(56,189,248,.30);
  --card:rgba(7,18,33,.72);--cardb:rgba(56,189,248,.08);
  --c-east:#2dd4bf;--c-north:#38bdf8;--c-west:#cbd5e1;--c-south:#fbbf24;
  --face:#071221;--face2:rgba(4,12,26,.92);
  --ring1:rgba(255,255,255,.04);--ring2:rgba(255,255,255,.10);
  --ring3:rgba(255,255,255,.16);
  --btn-g:linear-gradient(135deg,#0d9488,#0f766e);
  --srch-g:linear-gradient(135deg,#14b8a6,#0d9488);
  --cal-g:linear-gradient(90deg,#2dd4bf,#38bdf8);
  --tag-bg:rgba(45,212,191,.10);--so:0.40;--ss:rgba(255,255,255,.05);
  --ds:drop-shadow(0 4px 36px rgba(0,0,0,.8));
  --cs:0 2px 20px rgba(0,0,0,.35);
  --body-g:radial-gradient(ellipse at 50% 25%,rgba(45,212,191,.04) 0%,transparent 70%);
  --glare1:rgba(255,255,255,.045);--glare3:rgba(255,255,255,.025);
  --timeline-bg:rgba(255,255,255,.04);
}
[data-theme="light"]{
  --bg:#f3ede0;--surface:#fffdf7;--ring:rgba(139,105,20,.16);
  --tick:rgba(120,100,70,.20);--text:#3b2a10;--muted:#8b7752;
  --gold:#8b6914;--accent:#a67c1e;--ptr:#dc2626;--ptr2:rgba(139,105,20,.25);
  --card:rgba(255,252,242,.80);--cardb:rgba(180,150,100,.12);
  --c-east:#0d9488;--c-north:#2563eb;--c-west:#78716c;--c-south:#d97706;
  --face:#fdfaf2;--face2:rgba(255,250,235,.92);
  --ring1:rgba(139,105,20,.06);--ring2:rgba(139,105,20,.12);
  --ring3:rgba(139,105,20,.20);
  --btn-g:linear-gradient(135deg,#a67c1e,#8b6914);
  --srch-g:linear-gradient(135deg,#b8860b,#8b6914);
  --cal-g:linear-gradient(90deg,#a67c1e,#d97706);
  --tag-bg:rgba(139,105,20,.08);--so:0.50;--ss:rgba(139,105,20,.10);
  --ds:drop-shadow(0 4px 20px rgba(0,0,0,.10));
  --cs:0 2px 14px rgba(0,0,0,.06);
  --body-g:radial-gradient(ellipse at 50% 25%,rgba(139,105,20,.025) 0%,transparent 70%);
  --glare1:rgba(255,255,255,.35);--glare3:rgba(255,255,255,.20);
  --timeline-bg:rgba(0,0,0,.04);
}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Serif SC','Microsoft YaHei',serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:12px;user-select:none;-webkit-tap-highlight-color:transparent;background-image:var(--body-g);transition:background .4s,color .4s}
.app{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px}
.tbar{width:100%;display:flex;justify-content:flex-end;gap:6px}
.tbtn{background:var(--card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--cardb);color:var(--muted);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:.7rem;font-family:inherit;font-weight:500;transition:all .25s;letter-spacing:.03em}
.tbtn.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.sbar{width:100%;display:flex;gap:8px;background:var(--card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--cardb);border-radius:34px;padding:7px 8px 7px 18px;transition:box-shadow .3s;box-shadow:inset 0 1px 0 var(--glare1),var(--cs)}
.sbar:focus-within{box-shadow:inset 0 1px 0 var(--glare1),0 0 0 2px rgba(45,212,191,.10)}
.sin{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:.9rem;font-family:inherit;letter-spacing:.02em}
.sin::placeholder{color:var(--muted);opacity:.55}
.sbtn{background:var(--srch-g);border:none;color:#fff;border-radius:28px;padding:9px 20px;font-weight:600;font-size:.85rem;font-family:inherit;cursor:pointer;transition:transform .15s;box-shadow:0 2px 12px rgba(14,165,233,.22);white-space:nowrap}
.sbtn:active{transform:scale(.95)}
.aBox{background:var(--card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--cardb);border-radius:36px;padding:6px 22px;display:flex;align-items:baseline;gap:4px;box-shadow:inset 0 1px 0 var(--glare1),var(--cs)}
.aNum{font-size:2.2rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.aDeg{color:var(--muted);font-size:1rem}
.cW{position:relative;width:100%;aspect-ratio:1/1;max-width:400px}
.cW::before{content:'';position:absolute;inset:3% 6% 45% 8%;background:linear-gradient(175deg,var(--glare1) 0%,transparent 65%);border-radius:40%;pointer-events:none;z-index:2;filter:blur(8px)}
.cW::after{content:'';position:absolute;inset:48% 8% 8% 40%;background:linear-gradient(345deg,var(--glare3) 0%,transparent 60%);border-radius:35%;pointer-events:none;z-index:2;filter:blur(10px)}
.cS{width:100%;height:100%;display:block;filter:var(--ds)}
.badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--cardb);border-radius:18px;padding:4px 16px;font-size:.95rem;font-weight:600;color:var(--gold);white-space:nowrap;z-index:10;pointer-events:none;letter-spacing:.04em;box-shadow:inset 0 1px 0 var(--glare1)}
.bRow{display:flex;gap:8px;width:100%}
.btn{flex:1;background:var(--card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--cardb);color:var(--text);padding:11px 0;border-radius:30px;cursor:pointer;font-size:.85rem;font-family:inherit;font-weight:500;transition:all .2s;text-align:center;letter-spacing:.03em;box-shadow:inset 0 1px 0 var(--glare1)}
.btn:active{transform:scale(.96)}
.btn.a{background:var(--btn-g);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 2px 14px rgba(14,165,233,.18)}
.card{width:100%;background:var(--card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--cardb);border-radius:18px;padding:16px;box-shadow:inset 0 1px 0 var(--glare1),var(--cs)}
.sr{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sn{font-size:1.55rem;font-weight:700;color:var(--gold)}
.lic{cursor:pointer;font-size:1rem;opacity:.4;transition:opacity .2s}.lic:hover{opacity:.8}
.tgs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:.7rem;padding:3px 10px;border-radius:14px;font-weight:500;letter-spacing:.02em}
.te{background:var(--tag-bg);color:var(--gold);border:1px solid rgba(45,212,191,.08)}
.tq{background:rgba(128,128,128,.05);color:var(--muted);border:1px solid rgba(128,128,128,.06)}
.pBar{font-size:.72rem;color:var(--muted);margin-bottom:8px;letter-spacing:.02em}
.pBar span{color:var(--gold);font-weight:500}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:.7rem}
.ii{background:rgba(128,128,128,.025);border:1px solid rgba(128,128,128,.04);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:2px}
.il{color:var(--muted);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.iv{color:var(--text);font-weight:500;line-height:1.35}

/* 日历卡片 */
.calCard .calHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.calCard .calDate{font-size:1.3rem;font-weight:700;color:var(--gold)}
.calCard .calLunar{font-size:.78rem;color:var(--muted)}
.calCard .calGanzhi{font-size:.85rem;color:var(--text);font-weight:500;background:rgba(128,128,128,.06);padding:2px 10px;border-radius:12px}
.calTimeWrap{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.calSeg{padding:5px 10px;border-radius:10px;font-size:.7rem;font-weight:500;background:rgba(128,128,128,.04);color:var(--muted);transition:all .25s}
.calSeg.now{background:var(--tag-bg);color:var(--gold);font-weight:600;border:1px solid rgba(45,212,191,.15)}
.calSeg .t{display:block;font-size:.62rem;opacity:.6;margin-top:1px}
.calNav{display:flex;gap:4px;align-items:center;justify-content:center}
.calNavBtn{background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:2px 8px;font-family:inherit}
.calNavBtn:hover{color:var(--gold)}
.calNavDate{font-size:.72rem;color:var(--muted);min-width:70px;text-align:center}
.calMore{margin-top:8px;font-size:.65rem;color:var(--muted);text-align:center;cursor:pointer;opacity:.6;letter-spacing:.04em}.calMore:hover{opacity:1}

.cal{position:fixed;inset:0;background:rgba(3,8,16,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .3s}
.cal.hid{display:none}
.calT{font-size:1.15rem;color:#5eead4;font-weight:600;margin-bottom:28px}
.calR{width:140px;height:140px;border:3px dashed #5eead4;border-radius:50%;margin-bottom:28px;display:flex;align-items:center;justify-content:center;animation:calSp 2.5s linear infinite}
.calRi{width:100px;height:100px;border:2px dashed rgba(94,234,212,.3);border-radius:50%;animation:calSp 4s linear infinite reverse}
@keyframes calSp{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.calP{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-bottom:10px;overflow:hidden}
.calPb{height:100%;width:0%;background:var(--cal-g);border-radius:2px;transition:width .25s}
.calSt{color:rgba(255,255,255,.5);font-size:.82rem;margin-bottom:28px}
.calX{padding:13px 44px;background:linear-gradient(135deg,#14b8a6,#0d9488);border:none;border-radius:30px;color:#fff;font-weight:600;font-size:.95rem;font-family:inherit;cursor:pointer;box-shadow:0 4px 18px rgba(20,184,166,.25)}
@keyframes fl{0%,100%{fill:inherit}50%{fill:#fbbf24}}
.sf{animation:fl .28s ease-in-out 3}
</style>
</head>
<body>
<div class="app">

</div>
<div class="bRow"><button class="btn a" id="calB">🧭校准</button><button class="btn" id="rstB">↺重置</button></div>

(function initCal(){
var calShiftDays=0;
window.calShift=function(d){calShiftDays+=d;renderCal()};

function fmtDate(y,m,d){return y+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d}
function getKey(d){var m=d.getMonth()+1,da=d.getDate();return(m<10?'0':'')+m+(da<10?'0':'')+da}
function parseTime(t){var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1])}

function renderCal(){
var now=new Date();now.setDate(now.getDate()+calShiftDays);
var key=getKey(now);var entry=calData[key];
var label=calShiftDays===0?'今天':calShiftDays===1?'明天':calShiftDays===-1?'昨天':fmtDate(now.getFullYear(),now.getMonth()+1,now.getDate());
document.getElementById('calNavDate').textContent=label;

if(!entry){document.getElementById('calDate').textContent=fmtDate(now.getFullYear(),now.getMonth()+1,now.getDate());document.getElementById('calGz').textContent='—';document.getElementById('calLunar').textContent='暂无数据';document.getElementById('calSegs').innerHTML='';document.getElementById('calActive').textContent='';return}

document.getElementById('calDate').textContent=fmtDate(now.getFullYear(),now.getMonth()+1,now.getDate());
document.getElementById('calGz').textContent=entry.g+'日';
document.getElementById('calLunar').textContent=entry.l;

var segsEl=document.getElementById('calSegs');segsEl.innerHTML='';
var nowMins=calShiftDays===0?new Date().getHours()*60+new Date().getMinutes():-1;
var active='';
entry.s.forEach(function(seg){
var div=document.createElement('span');div.className='calSeg';
var isNow=calShiftDays===0&&nowMins>=parseTime(seg[1])&&nowMins<parseTime(seg[2]);
if(isNow){div.classList.add('now');active=seg[0]}
div.textContent=seg[0];var t=document.createElement('span');t.className='t';t.textContent=seg[1]+'-'+seg[2];div.appendChild(t);segsEl.appendChild(div)});
document.getElementById('calActive').textContent=active?'当前：'+active:calShiftDays!==0?'':'今日已过';
}
renderCal();
setInterval(function(){if(calShiftDays===0)renderCal()},60000);
})();
</script>
